<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Chhatrapati Shahu Swimming Pool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      padding: 40px;
      min-height: 100vh;
    }
    .admin-container { max-width: 1200px; margin: 0 auto; }

    /* Header */
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 16px;
    }
    .admin-title { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; }
    .admin-title em { color: var(--accent); font-style: italic; }
    .header-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    /* Buttons */
    .back-btn {
      color: var(--text); text-decoration: none; font-size: 0.9rem;
      border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px;
      transition: background 0.2s ease;
    }
    .back-btn:hover { background: rgba(255,255,255,0.05); }

    .manage-batches-btn {
      display: flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      color: #fff; border: none; padding: 10px 20px; border-radius: 8px;
      font-family: var(--font-sans); font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(6,182,212,0.3);
    }
    .manage-batches-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 28px rgba(6,182,212,0.45); }
    .manage-batches-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* Table */
    .table-wrapper {
      background: rgba(255,255,255,0.02); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    th {
      font-family: var(--font-mono); font-size: 0.85rem;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: #94a3b8; background: rgba(0,0,0,0.2);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: rgba(255,255,255,0.04); }
    .td-name { font-weight: 500; }
    .td-date { color: var(--accent); font-family: var(--font-mono); }
    .empty-state { padding: 60px 20px; text-align: center; color: #94a3b8; }

    /* Modal Overlay */
    .batch-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .batch-modal-overlay.active { opacity: 1; visibility: visible; }

    /* Modal Box */
    .batch-modal {
      background: #0f172a; border: 1px solid rgba(6,182,212,0.25);
      border-radius: 16px; width: 90%; max-width: 860px; max-height: 90vh;
      overflow-y: auto; padding: 36px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 60px rgba(6,182,212,0.08);
      transform: translateY(20px); transition: transform 0.3s ease;
    }
    .batch-modal-overlay.active .batch-modal { transform: translateY(0); }

    .batch-modal-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 28px; padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .batch-modal-title { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 400; }
    .batch-modal-title em { color: #67e8f9; font-style: italic; }
    .batch-modal-subtitle { font-size: 0.82rem; color: #64748b; margin-top: 4px; }

    .batch-modal-close {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8; width: 36px; height: 36px; border-radius: 8px;
      cursor: pointer; font-size: 1.1rem; display: flex;
      align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0;
    }
    .batch-modal-close:hover { background: rgba(239,68,68,0.15); color: #f87171; border-color: rgba(239,68,68,0.3); }

    /* Batch Grid */
    .batch-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px; margin-bottom: 28px;
    }
    .batch-card {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 16px; transition: border-color 0.2s;
    }
    .batch-card:hover { border-color: rgba(6,182,212,0.3); }
    .batch-card.modified { border-color: rgba(6,182,212,0.5); background: rgba(6,182,212,0.05); }

    .batch-slot-label {
      font-family: var(--font-mono); font-size: 0.8rem; color: #67e8f9;
      margin-bottom: 4px; display: flex; align-items: center; gap: 6px;
    }
    .batch-slot-label::before {
      content: ''; width: 6px; height: 6px; background: #67e8f9;
      border-radius: 50%; box-shadow: 0 0 6px #67e8f9; flex-shrink: 0;
    }
    .batch-break-label { font-size: 0.7rem; color: #475569; margin-bottom: 12px; }

    .batch-fields { display: flex; flex-direction: column; gap: 10px; }
    .batch-field label {
      display: block; font-size: 0.7rem; color: #64748b;
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
    }
    .batch-field input {
      width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; color: #e2e8f0; padding: 8px 10px;
      font-family: var(--font-mono); font-size: 0.9rem;
      box-sizing: border-box; transition: border-color 0.2s;
    }
    .batch-field input:focus { outline: none; border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6,182,212,0.15); }

    /* Save Bar */
    .batch-save-bar {
      display: flex; justify-content: flex-end; gap: 12px;
      padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08);
      flex-wrap: wrap; align-items: center;
    }
    .btn-cancel {
      background: transparent; border: 1px solid rgba(255,255,255,0.15);
      color: #94a3b8; padding: 10px 24px; border-radius: 8px;
      font-family: var(--font-sans); font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.05); }
    .btn-save {
      background: linear-gradient(135deg, #06b6d4, #0891b2); color: #fff;
      border: none; padding: 10px 28px; border-radius: 8px;
      font-family: var(--font-sans); font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-save:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(6,182,212,0.4); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .save-status {
      font-size: 0.8rem; color: #4ade80; display: none;
      margin-right: auto;
    }
    .save-status.error { color: #f87171; }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <h1 class="admin-title">Booking <em>Dashboard</em></h1>
      <div class="header-actions">
        <button class="manage-batches-btn" id="open-batches-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
          </svg>
          Manage Batches
        </button>
        <a href="/" class="back-btn">&#8592; Back to Site</a>
      </div>
    </div>

    <div class="table-wrapper">
      <table id="bookings-table">
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Phone</th>
            <th>Program</th><th>Date</th><th>Time Slot</th><th>Notes</th>
          </tr>
        </thead>
        <tbody id="bookings-body">
          <tr><td colspan="7" class="empty-state">Loading bookings...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- BATCH MANAGEMENT MODAL -->
  <div class="batch-modal-overlay" id="batch-modal-overlay">
    <div class="batch-modal" id="batch-modal">
      <div class="batch-modal-header">
        <div>
          <h2 class="batch-modal-title">Manage <em>Batches</em></h2>
          <p class="batch-modal-subtitle">Set active coaches &amp; students per 45-min slot &middot; 15-min break after each</p>
        </div>
        <button class="batch-modal-close" id="close-batches-btn" aria-label="Close">&#x2715;</button>
      </div>
      <div class="batch-grid" id="batch-grid"></div>
      <div class="batch-save-bar">
        <span class="save-status" id="save-status"></span>
        <button class="btn-cancel" id="cancel-batches-btn">Cancel</button>
        <button class="btn-save" id="save-batches-btn">Save All Batches</button>
      </div>
    </div>
  </div>

  <script>
    function pad(n) { return String(n).padStart(2, '0'); }

    function formatClock12(minutes) {
      const hour24 = Math.floor(minutes / 60) % 24;
      const hour12 = hour24 % 12 || 12;
      return hour12 + ':' + pad(minutes % 60) + ' ' + (hour24 >= 12 ? 'PM' : 'AM');
    }

    function formatRange12(startMinutes, endMinutes) {
      return formatClock12(startMinutes) + ' – ' + formatClock12(endMinutes);
    }

    function formatStoredRange12(value) {
      if (typeof value !== 'string') return value || '—';
      const match = value.match(/^(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})$/);
      if (!match) return value;
      return formatRange12(Number(match[1]) * 60 + Number(match[2]), Number(match[3]) * 60 + Number(match[4]));
    }

    function generateSlots() {
      const slots = [];
      const startM = 6 * 60, endM = 22 * 60;
      for (let m = startM; m + 45 <= endM; m += 60) {
        const batchEnd = m + 45, breakEnd = m + 60;
        const slotLabel  = pad(Math.floor(m/60)) + ':' + pad(m%60) + ' \u2013 ' + pad(Math.floor(batchEnd/60)) + ':' + pad(batchEnd%60);
        const breakLabel = breakEnd <= endM
          ? pad(Math.floor(batchEnd/60)) + ':' + pad(batchEnd%60) + ' \u2013 ' + pad(Math.floor(breakEnd/60)) + ':' + pad(breakEnd%60) + ' \u00b7 break'
          : null;
        slots.push({ slotLabel, displayLabel: formatRange12(m, batchEnd), breakLabel, displayBreakLabel: breakEnd <= endM ? formatRange12(batchEnd, breakEnd) + ' · break' : null });
      }
      return slots;
    }

    const SLOTS = generateSlots();
    let adminPassword = null;
    let batchData = {};

    // ── Bookings table ──
    document.addEventListener('DOMContentLoaded', async () => {
      const tbody = document.getElementById('bookings-body');
      const manageButton = document.getElementById('open-batches-btn');
      const password = prompt('Enter the admin password configured in Vercel:');

      if (!password) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Admin password is required. Reload this page to try again.</td></tr>';
        manageButton.disabled = true;
        return;
      }
      adminPassword = password;

      try {
        const response = await fetch('/api/bookings', {
          headers: { 'Authorization': password }
        });
        const responseData = await response.json().catch(() => ({}));

        if (!response.ok) {
          const message = responseData.error || (response.status === 401 ? 'Incorrect admin password.' : 'Could not load bookings.');
          tbody.innerHTML = '<tr><td colspan="7" class="empty-state" style="color:#ef4444;"></td></tr>';
          tbody.querySelector('.empty-state').textContent = message;
          manageButton.disabled = true;
          return;
        }

        const data = responseData;
        if (!Array.isArray(data)) throw new Error('The booking API returned an unexpected response.');
        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No bookings found.</td></tr>';
          return;
        }

        tbody.innerHTML = '';
        data.forEach(booking => {
          const tr = document.createElement('tr');
          const addCell = (value, className) => {
            const td = document.createElement('td');
            td.textContent = value == null || value === '' ? '—' : String(value);
            if (className) td.className = className;
            return td;
          };
          tr.appendChild(addCell('#' + booking.id));
          tr.appendChild(addCell(booking.name, 'td-name'));
          tr.appendChild(addCell(booking.phone));
          tr.appendChild(addCell(booking.program));
          tr.appendChild(addCell(booking.date, 'td-date'));
          tr.appendChild(addCell(formatStoredRange12(booking.time)));
          const notesCell = addCell(booking.notes);
          notesCell.style.maxWidth = '200px';
          notesCell.style.whiteSpace = 'nowrap';
          notesCell.style.overflow = 'hidden';
          notesCell.style.textOverflow = 'ellipsis';
          notesCell.title = booking.notes || '';
          tr.appendChild(notesCell);
          tbody.appendChild(tr);
        });
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-state" style="color:#ef4444;">Error loading bookings. Check the API and database settings in Vercel.</td></tr>';
        manageButton.disabled = true;
      }
    });

    // ── Open modal ──
    async function openBatchModal() {
      const grid = document.getElementById('batch-grid');
      const saveBtn = document.getElementById('save-batches-btn');
      grid.innerHTML = '<div class="empty-state">Loading saved batch counts…</div>';
      saveBtn.disabled = true;
      document.getElementById('batch-modal-overlay').classList.add('active');
      document.body.style.overflow = 'hidden';
      document.getElementById('save-status').style.display = 'none';

      try {
        const res = await fetch('/api/batch-config', {
          headers: { 'Authorization': adminPassword }
        });
        const cfg = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(cfg.error || 'Could not load saved batch counts.');
        }
        if (!Array.isArray(cfg)) {
          throw new Error('The batch API returned an unexpected response.');
        }

        batchData = {};
        cfg.forEach(row => {
          batchData[row.slot] = { coaches: row.coaches, students: row.students };
        });

        grid.innerHTML = '';
        SLOTS.forEach(function(s) {
          const slotLabel = s.slotLabel, breakLabel = s.breakLabel;
          const existing = batchData[slotLabel] || {};
          const card = document.createElement('div');
          card.className = 'batch-card';
          card.dataset.slot = slotLabel;
          card.innerHTML =
            '<div class="batch-slot-label">' + s.displayLabel + '</div>' +
            (s.displayBreakLabel ? '<div class="batch-break-label">&#9208; ' + s.displayBreakLabel + '</div>' : '') +
            '<div class="batch-fields">' +
              '<div class="batch-field">' +
                '<label>Active Coaches</label>' +
                '<input type="number" min="0" max="50" step="1" placeholder="0" class="coaches-input" value="' + (existing.coaches !== undefined ? existing.coaches : '') + '" data-slot="' + slotLabel + '">' +
              '</div>' +
              '<div class="batch-field">' +
                '<label>Active Students</label>' +
                '<input type="number" min="0" max="500" step="1" placeholder="0" class="students-input" value="' + (existing.students !== undefined ? existing.students : '') + '" data-slot="' + slotLabel + '">' +
              '</div>' +
            '</div>';

          card.querySelectorAll('input').forEach(function(inp) {
            inp.addEventListener('input', function() { card.classList.add('modified'); });
          });
          grid.appendChild(card);
        });
        saveBtn.disabled = false;
      } catch (error) {
        grid.innerHTML = '<div class="empty-state" style="color:#f87171;">Could not load existing batch counts. No values have been changed. Close this window and check your Vercel settings.</div>';
        showStatus('✕ ' + (error.message || 'Failed to load saved batch counts.'), true);
        // Never permit a save when the existing data could not be loaded.
        saveBtn.disabled = true;
      }
    }

    function closeBatchModal() {
      document.getElementById('batch-modal-overlay').classList.remove('active');
      document.body.style.overflow = '';
    }

    // ── Save batches ──
    async function saveBatches() {
      const saveBtn = document.getElementById('save-batches-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving\u2026';

      const payload = SLOTS.map(function(s) {
        const slotLabel = s.slotLabel;
        const card = document.querySelector('.batch-card[data-slot="' + slotLabel + '"]');
        const coaches  = parseInt(card.querySelector('.coaches-input').value)  || 0;
        const students = parseInt(card.querySelector('.students-input').value) || 0;
        return { slot: slotLabel, coaches: coaches, students: students };
      });

      try {
        const res = await fetch('/api/batch-config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': adminPassword },
          body: JSON.stringify({ batches: payload })
        });
        if (res.ok) {
          showStatus('\u2713 All batches saved successfully.', false);
          payload.forEach(function(b) { batchData[b.slot] = { coaches: b.coaches, students: b.students }; });
          document.querySelectorAll('.batch-card.modified').forEach(function(c) { c.classList.remove('modified'); });
        } else {
          const err = await res.json().catch(function() { return {}; });
          showStatus('\u2715 ' + (err.error || 'Failed to save.'), true);
        }
      } catch (e) {
        showStatus('\u2715 Network error. Please try again.', true);
      }
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save All Batches';
    }

    function showStatus(msg, isError) {
      var el = document.getElementById('save-status');
      el.textContent = msg;
      el.className = 'save-status' + (isError ? ' error' : '');
      el.style.display = 'block';
    }

    // ── Wire events ──
    document.getElementById('open-batches-btn').addEventListener('click', openBatchModal);
    document.getElementById('close-batches-btn').addEventListener('click', closeBatchModal);
    document.getElementById('cancel-batches-btn').addEventListener('click', closeBatchModal);
    document.getElementById('save-batches-btn').addEventListener('click', saveBatches);
    document.getElementById('batch-modal-overlay').addEventListener('click', function(e) {
      if (e.target === e.currentTarget) closeBatchModal();
    });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeBatchModal(); });
  </script>
</body>
</html>
